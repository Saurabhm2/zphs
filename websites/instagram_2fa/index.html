<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram · Two‑Factor Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Billabong&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 14px;
        color: #262626;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .page-wrap {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        flex: 1;
        padding: 30px 20px;
        max-width: 935px;
        width: 100%;
        gap: 32px;
        margin: 0 auto;
      }

      .phone-section {
        flex-basis: 454px;
        flex-shrink: 0;
        height: 618px;
        background: url("https://www.instagram.com/static/images/homepage/home-phones.png/38825c9d5aa2.png")
          no-repeat center center;
        background-size: 454px 618px;
      }

      .right-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 350px;
        width: 100%;
      }

      .card {
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 1px;
        padding: 10px 0;
      }

      .twofa-card {
        padding: 20px 40px 28px;
      }

      .instagram-logo {
        display: flex;
        justify-content: center;
        margin: 20px auto 16px;
      }

      .instagram-logo svg {
        width: 56px;
        height: 56px;
      }

      .twofa-title {
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        color: #262626;
        margin-bottom: 8px;
      }

      .twofa-subtitle {
        font-size: 14px;
        color: #999;
        text-align: center;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      .input-wrap {
        position: relative;
        margin-bottom: 6px;
      }

      .input-wrap input {
        width: 100%;
        background: #fafafa;
        border: 1px solid #efefef;
        border-radius: 3px;
        font-size: 14px;
        color: #262626;
        padding: 9px 10px 7px;
        outline: none;
        transition: border-color 0.1s;
      }

      .input-wrap input:focus {
        border-color: #a8a8a8;
      }

      .input-wrap input::placeholder {
        color: #999;
        font-weight: 300;
      }

      .btn-confirm {
        width: 100%;
        background: #3897f0;
        border: none;
        border-radius: 3px;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        line-height: 28px;
        padding: 0 8px;
        cursor: pointer;
        margin-top: 8px;
        transition: opacity 0.1s;
      }

      .btn-confirm:hover {
        opacity: 0.85;
      }
      .btn-confirm:active {
        opacity: 0.7;
      }

      .resend-wrap {
        text-align: center;
        margin-top: 14px;
        font-size: 12px;
        color: #003569;
      }

      .resend-wrap a {
        color: #3897f0;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      .resend-wrap a:hover {
        text-decoration: underline;
      }

      .signup-card {
        padding: 16px 44px;
        text-align: center;
        font-size: 14px;
        color: #262626;
      }

      .signup-card a {
        color: #3897f0;
        font-weight: 600;
        text-decoration: none;
      }

      .app-section {
        text-align: center;
        margin-top: 6px;
      }

      .app-section p {
        font-size: 14px;
        color: #262626;
        margin-bottom: 14px;
      }

      .app-badges {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .app-badges a img {
        height: 40px;
      }

      footer {
        width: 100%;
        max-width: 935px;
        padding: 20px 20px 52px;
        margin: 0 auto;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 16px;
        margin-bottom: 12px;
        list-style: none;
      }

      .footer-links li a {
        font-size: 12px;
        color: #999;
        text-decoration: none;
        font-weight: 400;
        text-transform: none;
        line-height: 2;
      }

      .footer-copy {
        text-align: center;
        font-size: 12px;
        color: #999;
        text-transform: uppercase;
        font-weight: 600;
      }

      @media (max-width: 875px) {
        .phone-section {
          display: none;
        }
        .page-wrap {
          justify-content: center;
          padding-top: 40px;
        }
      }

      @media (max-width: 500px) {
        .right-section {
          max-width: 100%;
        }
        .twofa-card {
          padding: 20px 28px 28px;
        }
        .signup-card {
          padding: 16px 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div class="phone-section"></div>
      <div class="right-section">
        <div class="card twofa-card">
          <div class="instagram-logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f9ce34" />
                  <stop offset="20%" stop-color="#ee2a7b" />
                  <stop offset="60%" stop-color="#6228d7" />
                  <stop offset="100%" stop-color="#f9ce34" />
                </linearGradient>
              </defs>
              <rect
                x="2"
                y="2"
                width="20"
                height="20"
                rx="5"
                fill="url(#igGrad)"
              />
              <circle cx="12" cy="12" r="4" fill="white" stroke="none" />
              <circle cx="18" cy="6" r="1.5" fill="white" stroke="none" />
            </svg>
          </div>
          <h2 class="twofa-title">Two‑Step Verification</h2>
          <p class="twofa-subtitle">
            Enter 8 Digit Code to Start the Dare Challenge
          </p>
          <div class="input-wrap">
            <input
              type="text"
              placeholder="8‑digit code"
              maxlength="8"
              autocomplete="one-time-code"
              inputmode="numeric"
            />
          </div>
          <button class="btn-confirm">Confirm</button>
          <div class="resend-wrap">
            Didn't get a security code? We can
            <a href="#">resend it.</a>
          </div>
        </div>
        <div class="card signup-card">
          Don't have an account? <a href="#">Sign up</a>
        </div>
        <div class="app-section">
          <p>Get the app.</p>
          <div class="app-badges">
            <a
              href="https://itunes.apple.com/app/instagram/id389801252"
              target="_blank"
            >
              <img
                src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png"
                alt="Available on the App Store"
              />
            </a>
            <a
              href="https://play.google.com/store/apps/details?id=com.instagram.android"
              target="_blank"
            >
              <img
                src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png"
                alt="Get it on Google Play"
              />
            </a>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <ul class="footer-links">
        <li><a href="#">About us</a></li>
        <li><a href="#">Support</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Press</a></li>
        <li><a href="#">API</a></li>
        <li><a href="#">Jobs</a></li>
        <li><a href="#">Privacy</a></li>
        <li><a href="#">Terms</a></li>
        <li><a href="#">Directory</a></li>
        <li><a href="#">Language</a></li>
      </ul>
      <p class="footer-copy">© 2018 Instagram</p>
    </footer>
  </body>
</html>
